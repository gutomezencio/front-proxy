version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  # Also keeps the SHA-pinned actions (and their version comments) current
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
