name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  # Push the version commit and tag
  contents: write
  # OIDC token for npm trusted publishing (no NPM_TOKEN secret)
  id-token: write

concurrency:
  group: publish

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+, which ships with Node 24
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test

      - name: Bump the version
        id: version
        run: |
          VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Update the Socket badge in README.md
        run: |
          sed -i "s#\(badge\.socket\.dev/npm/package/front-proxy/\)[^)]*#\1${{ steps.version.outputs.version }}#g" README.md
          grep -q "front-proxy/${{ steps.version.outputs.version }}" README.md

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main "v${{ steps.version.outputs.version }}"

      - run: npm publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes --verify-tag
