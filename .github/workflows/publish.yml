name: Publish

# Runs when a release PR from prepare-release.yml is merged: publishes the
# package.json version if npm doesn't have it yet, then creates the release and
# lists that version in the MCP Registry. The release carries the published
# tarball, the Claude Desktop bundle (front-proxy.mcpb) and their Sigstore
# provenance bundle. npm's trusted publisher is configured for this file name,
# so keep it.
on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Create the tag and the GitHub release
      contents: write
      # OIDC token for npm trusted publishing (no NPM_TOKEN secret), for signing
      # and for the MCP Registry login (github-oidc)
      id-token: write
      # Store the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm 11.5.1+, which ships with Node 24
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "front-proxy@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.published == 'false'
        run: npm ci
      - if: steps.check.outputs.published == 'false'
        run: npm run typecheck
      - if: steps.check.outputs.published == 'false'
        run: npm test

      # Pack once, so npm and the GitHub release get the same signed file.
      # npm pack runs the prepack script, which builds dist/ from src/.
      - name: Pack the tarball
        id: pack
        if: steps.check.outputs.published == 'false'
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.published == 'false'
        run: npm publish "./${{ steps.pack.outputs.tarball }}"

      # One-click bundle for Claude Desktop, with the same name in every release so
      # releases/latest/download/front-proxy.mcpb always points to the newest one
      - name: Build the MCP bundle
        if: steps.check.outputs.published == 'false'
        run: npm run build:mcpb

      - name: Sign the tarball and the MCP bundle
        id: attest
        if: steps.check.outputs.published == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pack.outputs.tarball }}
            front-proxy.mcpb

      - name: Create the GitHub release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$TARBALL.sigstore.json"
          gh release create "v${{ steps.check.outputs.version }}" --target "$GITHUB_SHA" --generate-notes \
            "$TARBALL" "$TARBALL.sigstore.json" front-proxy.mcpb

      # Lists this version in the official MCP Registry (server.json). The registry checks
      # ownership through "mcpName" in the npm package just published. mcp-publisher is
      # pinned and checked against the release's checksum.
      - name: Install mcp-publisher
        if: steps.check.outputs.published == 'false'
        env:
          VERSION: 1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # The MCP Registry checks that the version exists on npm, and a version just
      # published can take a few minutes to show up there.
      - name: Wait for npm to serve this version
        if: steps.check.outputs.published == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/front-proxy/$VERSION"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::front-proxy@$VERSION still isn't on registry.npmjs.org after 5 minutes"
          exit 1
      # npm's CDN is regional, so the registry's servers can still get a 404 after the
      # runner sees the version: retry the publish a few times.
      - name: Publish to the MCP Registry
        if: steps.check.outputs.published == 'false'
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Publish failed (attempt $attempt of 5), retrying in 30s"
              sleep 30
            fi
          done
          exit 1
