name: Publish

# Runs when a release PR from prepare-release.yml is merged: publishes the
# package.json version if npm doesn't have it yet, then creates the release.
# npm's trusted publisher is configured for this file name, so keep it.
on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  # Create the tag and the GitHub release
  contents: write
  # OIDC token for npm trusted publishing (no NPM_TOKEN secret)
  id-token: write

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+, which ships with Node 24
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "front-proxy@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.published == 'false'
        run: npm ci
      - if: steps.check.outputs.published == 'false'
        run: npm test
      - if: steps.check.outputs.published == 'false'
        run: npm publish

      - name: Create the GitHub release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.check.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
